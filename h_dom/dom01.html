<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <!-- 모든 태그는 객체(object)임 -->
    <p>Hello, World!</p>
    <strong class="test" style="color: red;">글자를 두껍게 파랑 두꺼비꺼비</strong>
</body>
<script>
    // const p = document.getElementsByTagName("p")
    // console.log(p[0])
    // p[0].innerText = "수정!"
    const strong = document.getElementsByClassName("test")[0]
    console.log(strong)
    strong.style.color = "blue"
</script>
</html>
